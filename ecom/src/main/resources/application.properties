spring.application.name=ecommerce
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-message=never
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:}
app.client-origin=${CLIENT_ORIGIN:http://localhost:4200}
app.bootstrap-admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Administrador}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.db.enabled=true

# --- Pasarelas de pago -------------------------------------------------------
# TEST rechaza llaves de produccion: una instalacion de demo no puede cobrar.
app.payments.mode=${PAYMENTS_MODE:TEST}
app.payments.currency=${PAYMENTS_CURRENCY:USD}
app.payments.simulated-enabled=${PAYMENTS_SIMULATED:true}
app.payments.return-url-base=${PAYMENTS_RETURN_URL:http://localhost:4200}
app.payments.paypal.enabled=${PAYPAL_ENABLED:false}
app.payments.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.payments.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.payments.paypal.api-base=${PAYPAL_API_BASE:https://api-m.sandbox.paypal.com}
app.payments.stripe.enabled=${STRIPE_ENABLED:false}
app.payments.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
